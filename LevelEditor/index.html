<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prizm GD Level Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <label>
    Width:
    <input id="width" type="number" value="120">
    </label>

    <label>
    Height:
    <input id="height" type="number" value="10">
    </label>

    <button onclick="newLevel()">Create Level</button>
    <button onclick="exportLevel()">Export</button>
    <button onclick="downloadLevelBinary(nameInput.value, diffInput.value, width, height, level)">Download Binary</button>
    <button onclick="loadLevel()">Load Level</button>
    <button onclick="changeSize()">Set Size</button>
    <button onclick="testLevel()">Test</button>
    <button onclick="stopTesting()" style="visibility: hidden;" id="stopButton">Stop</button>

    <canvas id="c"></canvas>
    <label>Name: <input id="nameInput" type="text"></label>
    <label>Difficulty: <input id="diffInput" type="number" value="0"></label>
    <textarea id="output"></textarea>

    <script src="script.js"></script>
    <script src="collisions.js"></script>
    <script src="game.js"></script>
</body>
</html>
