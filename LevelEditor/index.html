<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prizm GD Level Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="optionsBar">
        <div class="dropdown">
            <p>File</p>
            <div class="dropdownContent">
                <div onclick="openLevel()">Open</div>
                <div onclick="saveLevel()">Save</div>
                <div onclick="saveLevelAs()">Save As</div>
            </div>
        </div>
        
        <div class="dropdown">
            <p>Edit</p>
            <div class="dropdownContent">
                <div onclick="undo()">Undo</div>
                <div onclick="redo()">Redo</div>
                <div onclick="newLevel()">Clear Level</div>
                <div onclick="startPos = {x: 0, y: 19}">Reset Start Pos</div>
            </div>
        </div>

        <div class="dropdown">
            <p>View</p>
            <div class="dropdownContent">
                <div onclick="changeView(0)" id="showHitboxes">Show Hitboxes</div>
                <div onclick="changeView(1)" id="rotatePlayer">Hide Player Rot</div>
                <div onclick="changeView(2)" id="showTrail">Hide Trail</div>
                <div onclick="changeView(3)" id="showStartPos">Hide Start Pos</div>
            </div>
        </div>
        
        <div onclick="playButton()"><img src="Sprites/Play.svg" width="20px" height="20px" id="pausePlayImg"></div>

        <div class="editableText" onclick="startEditing()">
            <span id="levelNameText">Untitled Level</span>

            <img src="Sprites/PencilWhite.svg" alt="Edit" class="editIcon">

            <input id="levelNameInput" type="text" value="Untitled Level" onblur="stopEditing()" onkeydown="if(event.key==='Enter') stopEditing()">
        </div>

        <div class="dropdown">
            <img src="Sprites/diffIcon01.png" class="diffImg" id="curDiff">
            <div class="dropdownContent diffDropdownContent">
                <div class="diffItem"><img src="Sprites/diffIcon01.png" class="diffImg" onclick="updateDiff(0)"></div>
                <div class="diffItem"><img src="Sprites/diffIcon02.png" class="diffImg" onclick="updateDiff(1)"></div>
                <div class="diffItem"><img src="Sprites/diffIcon03.png" class="diffImg" onclick="updateDiff(2)"></div>
                <div class="diffItem"><img src="Sprites/diffIcon04.png" class="diffImg" onclick="updateDiff(3)"></div>
                <div class="diffItem"><img src="Sprites/diffIcon05.png" class="diffImg" onclick="updateDiff(4)"></div>
                <div class="diffItem"><img src="Sprites/diffIcon06.png" class="diffImg" onclick="updateDiff(5)"></div>
            </div>
        </div>

        <div class="levelInfo"><span id="dimensions">Width: 1, Height: 1</span>  <span id="size">Size: 1</span></div>
    </div>
    
    <canvas id="c"></canvas>

    <!-- <div id="selectionDropdown"> -->
    <!--     <select> -->
    <!--         <option value="copy">Copy</option> -->
    <!--         <option value="copy">Paste</option> -->
    <!--         <option value="copy"></option> -->
    <!--     </select> -->
    <!-- </div> -->

    <div id="videoCont" draggable="true">
        <video id="referenceVideo" src="./GDVideo.mov" height="400"></video> 
    </div>

    <div class="tileSelect">
        <!--Tiles added here with script-->
    </div>

    <div class="popupCont">
        <!--Popups added here with script-->
    </div>

    <script src="main.js"></script>
    <script src="collisions.js"></script>
    <script src="game.js"></script>
    <script src="ui.js"></script>
</body>
</html>
