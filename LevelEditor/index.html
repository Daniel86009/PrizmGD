<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prizm GD Level Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="optionsBar">
        <div class="dropdown">
            <p>File</p>
            <div class="dropdownContent">
                <div onclick="openLevel()">Open</div>
                <div onclick="saveLevel()">Save</div>
                <div onclick="saveLevelAs()">Save As</div>
            </div>
        </div>
        
        <div class="dropdown">
            <p>Edit</p>
            <div class="dropdownContent">
                <div onclick="newLevel()">Clear Level</div>    
                <div onclick="changeSize()">Set Size</div>
            </div>
        </div>
        
        
        <div onclick="playButton()"><img src="Sprites/Play.svg" width="20px" height="20px" id="pausePlayImg"></div>

        <div class="editableText" onclick="startEditing()">
            <span id="levelNameText">Untitled Level</span>

            <img src="Sprites/PencilWhite.svg" alt="Edit" class="editIcon">

            <input id="levelNameInput" type="text" value="Untitled Level" onblur="stopEditing()" onkeydown="if(event.key==='Enter') stopEditing()">
        </div>

        <div class="dropdown">
            <img src="Sprites/diffIcon01.png">
            <div class="dropdownContent" class="diffDropdownContent">
                <img src="Sprites/diffIcon01.png" class="diffImg">
                <img src="Sprites/diffIcon02.png" class="diffImg">
                <img src="Sprites/diffIcon03.png" class="diffImg">
                <img src="Sprites/diffIcon04.png" class="diffImg">
                <img src="Sprites/diffIcon05.png" class="diffImg">
            </div>
        </div>

        <div class="levelInfo"><span id="dimensions">Width: 1, Height: 1</span>  <span id="size">Size: 1</span></div>
    </div>
    
    <canvas id="c"></canvas>
    <label>Difficulty: <input id="diffInput" type="number" value="0"></label>

    <script src="script.js"></script>
    <script src="collisions.js"></script>
    <script src="game.js"></script>
</body>
</html>
