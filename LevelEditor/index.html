<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prizm GD Level Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <label>
    Width:
    <input id="width" type="number" value="120">
    </label>

    <label>
    Height:
    <input id="height" type="number" value="10">
    </label>

    <button onclick="newLevel()">Create Level</button>
    <button onclick="exportLevel()">Export</button>
    <button onclick="loadLevel()">Load Level</button>
    <button onclick="changeSize()">Set Size</button>

    <canvas id="c"></canvas>
    <input id="selectionInput" type="number">
    <textarea id="output"></textarea>

    <script src="script.js"></script>
</body>
</html>
